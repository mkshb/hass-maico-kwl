name: "Validate"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Read only, also if the repository default changes.
permissions:
  contents: read

jobs:
  hassfest:
    name: "Hassfest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0

      # hassfest and the HACS action stay on their branch, unlike the other
      # actions, which are pinned to a commit: they publish no releases, and
      # the daily run is meant to check against the current rules.
      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"

  hacs:
    name: "HACS"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
