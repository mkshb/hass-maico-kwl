blueprint:
  name: "Maico KWL: Demand boost from any sensor"
  description: >
    Boosts the Maico KWL to intensive ventilation when a Home Assistant sensor
    (e.g. CO2 or humidity from any room) rises above a threshold, and returns to
    a normal mode when it falls below the lower threshold (hysteresis). Lets you
    do demand-controlled ventilation with freely chosen HA sensors.

    Before boosting, the current operating mode and ventilation level are saved
    in a snapshot scene and restored afterwards. If you change the mode or level
    yourself during a boost, your setting is kept. If the unit is already in
    manual mode at the boost level, the automation does nothing.
  domain: automation
  author: hass-maico-kwl
  input:
    operating_mode:
      name: Operating mode select
      description: The Maico KWL "Operating mode" select entity.
      selector:
        entity:
          filter:
            - domain: select
              integration: maico_kwl
    level:
      name: Ventilation level select
      description: The Maico KWL "Ventilation level" select entity.
      selector:
        entity:
          filter:
            - domain: select
              integration: maico_kwl
    sensor:
      name: Trigger sensor
      description: Sensor whose value drives the boost (e.g. CO2 in ppm or humidity in %).
      selector:
        entity:
          filter:
            - domain: sensor
    threshold_high:
      name: Upper threshold
      description: At or above this value, boost to intensive.
      default: 1000
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          mode: box
    threshold_low:
      name: Lower threshold
      description: At or below this value, return to normal (hysteresis).
      default: 800
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          mode: box
    boost_level:
      name: Boost level
      default: intensive
      selector:
        select:
          options:
            - "nominal"
            - "intensive"
    revert_mode:
      name: Fallback revert mode
      description: >
        Operating mode to return to when the snapshot is lost, e.g. after a
        Home Assistant restart during a boost.
      default: auto_sensor
      selector:
        select:
          options:
            - "auto_sensor"
            - "auto_time"
            - "manual"

mode: queued
max_exceeded: silent

variables:
  operating_mode: !input operating_mode
  level: !input level
  sensor: !input sensor
  threshold_high: !input threshold_high
  threshold_low: !input threshold_low
  boost_level: !input boost_level
  revert_mode: !input revert_mode
  value: "{{ states(sensor) | float('nan') }}"
  snapshot_id: >
    maico_kwl_boost_{{ (this.attributes.id | default(this.entity_id.split('.')[1], true)) | slugify }}
  snapshot: "scene.{{ snapshot_id }}"
  has_snapshot: "{{ snapshot in states.scene | map(attribute='entity_id') | list }}"
  boosted: "{{ is_state(operating_mode, 'manual') and is_state(level, boost_level) }}"

trigger:
  - platform: state
    entity_id: !input sensor
  - platform: homeassistant
    event: start
    id: start

condition:
  - condition: template
    value_template: "{{ value == value }}"  # skip unknown/unavailable (NaN)

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ value >= (threshold_high | float) and not boosted }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ not has_snapshot }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ snapshot_id }}"
                  snapshot_entities:
                    - "{{ level }}"
                    - "{{ operating_mode }}"
          - action: select.select_option
            target:
              entity_id: !input operating_mode
            data:
              option: "manual"
          - action: select.select_option
            target:
              entity_id: !input level
            data:
              option: "{{ boost_level }}"
      - conditions:
          - condition: template
            value_template: "{{ value <= (threshold_low | float) and has_snapshot }}"
        sequence:
          # Only restore while the unit is still as the automation left it.
          - if:
              - condition: template
                value_template: "{{ boosted }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ snapshot }}"
          - action: scene.delete
            target:
              entity_id: "{{ snapshot }}"
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'start' and value <= (threshold_low | float)
                 and not has_snapshot and boosted }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input operating_mode
            data:
              option: "{{ revert_mode }}"
    default: []
