blueprint:
  name: "Maico KWL: Reduce ventilation when a window is open"
  description: >
    Reduces the Maico KWL ventilation while one or more windows/doors are open
    (to avoid pulling unconditioned air), and restores normal operation once all
    are closed.

    Before reducing, the current operating mode and ventilation level are saved
    in a snapshot scene and restored afterwards. If you change the mode or level
    yourself while a window is open, your setting is kept. If the unit is
    already in manual mode at the reduced level, the automation does nothing.

    Snapshot scenes do not survive a Home Assistant restart. If the unit is
    still at the reduced level when Home Assistant starts, the automation
    assumes it reduced the unit and switches to the fallback restore mode once
    all contacts are closed.
  domain: automation
  author: hass-maico-kwl
  input:
    operating_mode:
      name: Operating mode select
      description: The Maico KWL "Operating mode" select entity.
      selector:
        entity:
          filter:
            - domain: select
              integration: maico_kwl
    level:
      name: Ventilation level select
      description: The Maico KWL "Ventilation level" select entity.
      selector:
        entity:
          filter:
            - domain: select
              integration: maico_kwl
    windows:
      name: Window/door contacts
      description: One or more binary sensors that are "on" when open.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    open_level:
      name: Level while open
      default: reduced
      selector:
        select:
          options:
            - "off"
            - "humidity_protection"
            - "reduced"
    restore_mode:
      name: Fallback restore mode
      description: >
        Operating mode to return to when the snapshot is lost, e.g. after a
        Home Assistant restart while a window was open.
      default: auto_sensor
      selector:
        select:
          options:
            - "auto_sensor"
            - "auto_time"
            - "manual"
    restore_level:
      name: Fallback restore level
      description: >
        Ventilation level to return to with the fallback restore mode "manual".
        In the auto modes the unit picks the level itself.
      default: nominal
      selector:
        select:
          options:
            - "reduced"
            - "nominal"
            - "intensive"

mode: queued
max_exceeded: silent

variables:
  operating_mode: !input operating_mode
  level: !input level
  windows: !input windows
  open_level: !input open_level
  restore_mode: !input restore_mode
  restore_level: !input restore_level
  any_open: "{{ expand(windows) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
  snapshot_id: >
    maico_kwl_window_{{ (this.attributes.id | default(this.entity_id.split('.')[1], true)) | slugify }}
  snapshot: "scene.{{ snapshot_id }}"
  reduced: "{{ is_state(operating_mode, 'manual') and is_state(level, open_level) }}"

trigger:
  - platform: state
    entity_id: !input windows
  - platform: homeassistant
    event: start
    id: start

action:
  # The snapshot is lost on a restart. If the unit is still reduced, stand in
  # with a snapshot of the fallback restore mode (and, for "manual", its level),
  # so the normal restore below still ends the reduction once all contacts are
  # closed.
  - if:
      - condition: template
        value_template: >
          {{ trigger.id == 'start' and reduced
             and snapshot not in states.scene | map(attribute='entity_id') | list }}
    then:
      - action: scene.create
        data:
          scene_id: "{{ snapshot_id }}"
          entities: >
            {{ {operating_mode: restore_mode, level: restore_level}
               if restore_mode == 'manual' else {operating_mode: restore_mode} }}
  - choose:
      # A snapshot existing means the automation is active; if the unit is no
      # longer reduced, the user changed it and it is left alone.
      - conditions:
          - condition: template
            value_template: >
              {{ any_open and not reduced
                 and snapshot not in states.scene | map(attribute='entity_id') | list }}
        sequence:
          - action: scene.create
            data:
              scene_id: "{{ snapshot_id }}"
              snapshot_entities:
                - "{{ level }}"
                - "{{ operating_mode }}"
          - action: select.select_option
            target:
              entity_id: !input operating_mode
            data:
              option: "manual"
          - action: select.select_option
            target:
              entity_id: !input level
            data:
              option: "{{ open_level }}"
      - conditions:
          - condition: template
            value_template: >
              {{ not any_open
                 and snapshot in states.scene | map(attribute='entity_id') | list }}
        sequence:
          # Only restore while the unit is still as the automation left it.
          - if:
              - condition: template
                value_template: "{{ reduced }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ snapshot }}"
          - action: scene.delete
            target:
              entity_id: "{{ snapshot }}"
    default: []
