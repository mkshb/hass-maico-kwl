name: Feature request
description: An idea for the integration, the dashboard card or the blueprints.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem, not only the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How could it work?

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
