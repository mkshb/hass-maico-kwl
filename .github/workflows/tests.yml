name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  # Daily, to catch a new Home Assistant release or beta before the users do.
  # The test package for it usually appears on PyPI in the morning (UTC).
  schedule:
    - cron: "0 14 * * *"

# Read only, also if the repository default changes.
permissions:
  contents: read

jobs:
  pytest:
    # The minimum keeps the plain name: "Pytest" is a required check for main.
    # The latest job only reports, so a beta that breaks something does not
    # block a pull request.
    name: "${{ matrix.ha == 'minimum' && 'Pytest' || 'Pytest (latest HA)' }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest release hacs.json allows, 2026.10.0. Move it along with
          # "homeassistant" in hacs.json.
          - ha: "minimum"
            requirement: "pytest-homeassistant-custom-component==0.13.371"
          # The newest release on PyPI, a beta in the week before a release.
          - ha: "latest"
            requirement: "pytest-homeassistant-custom-component"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0

      - name: "Set up Python"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"

      - name: "Install test requirements"
        run: pip install -r requirements_test.txt "${{ matrix.requirement }}"

      # Home Assistant installs the libraries of its modbus integration from
      # that integration's manifest, so they change with the release. Use the
      # ones of the installed release instead of the pins in
      # requirements_test.txt, which are those of 2026.10.0.
      - name: "Modbus libraries of this Home Assistant release"
        run: |
          python - > "${RUNNER_TEMP}/modbus.txt" <<'EOF'
          import importlib.util, json, pathlib
          ha = pathlib.Path(importlib.util.find_spec("homeassistant").origin).parent
          manifest = json.loads((ha / "components/modbus/manifest.json").read_text())
          print("\n".join(manifest["requirements"]))
          EOF
          cat "${RUNNER_TEMP}/modbus.txt"
          pip install -r "${RUNNER_TEMP}/modbus.txt"
          pip list | grep -i -E "^(homeassistant|modbus-connection|tmodbus|pymodbus) "

      - name: "Run tests"
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

      - name: "Type check"
        run: mypy

  card:
    name: "Card (${{ matrix.browser }})"
    # The card does not depend on the Home Assistant release.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # chromium: Chrome, Edge and the Android app (WebView).
        # webkit: Safari and the iOS app (WKWebView).
        browser: ["chromium", "webkit"]
    defaults:
      run:
        working-directory: "frontend-src"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0

      - name: "Set up Node"
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020" # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend-src/package-lock.json"

      - name: "Install dependencies"
        run: npm ci

      - name: "Type check"
        run: npm run typecheck

      - name: "Build"
        run: npm run build

      - name: "Committed build matches the sources"
        run: |
          git add --intent-to-add ../custom_components/maico_kwl/frontend
          git diff --exit-code -- ../custom_components/maico_kwl/frontend

      - name: "Unit tests"
        run: npm run test:unit

      - name: "Install the browser and Roboto"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: "Card in the browser"
        env:
          KWL_BROWSER: "${{ matrix.browser }}"
        run: npm run test:browser

      # The README shows the committed screenshots; these are for a look at
      # how the card renders on this run. Text rendering differs between
      # machines, so they are not compared pixel by pixel.
      - name: "Upload screenshots"
        if: always()
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
        with:
          name: "card-${{ matrix.browser }}"
          path: |
            docs/images/card-*.png
            frontend-src/test/out/*.png
          if-no-files-found: ignore
