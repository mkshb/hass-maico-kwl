name: "Validate"

# No run after a merge: the pull request was tested already, and the daily
# run on main catches what two pull requests break only together.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Read only, also if the repository default changes.
permissions:
  contents: read

jobs:
  changes:
    name: "Changes"
    runs-on: "ubuntu-latest"
    outputs:
      hassfest: "${{ steps.changes.outputs.hassfest }}"
      hacs: "${{ steps.changes.outputs.hacs }}"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      # Pull requests run the checks their files need, other runs all of them.
      - name: "Checks this change needs"
        id: changes
        run: .github/scripts/changes.sh "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

  hassfest:
    name: "Hassfest"
    needs: "changes"
    # A skipped job counts as passed for the required check.
    if: ${{ needs.changes.outputs.hassfest == 'true' }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      # hassfest and the HACS action stay on their branch, unlike the other
      # actions, which are pinned to a commit: they publish no releases, and
      # the daily run is meant to check against the current rules.
      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"

  hacs:
    name: "HACS"
    needs: "changes"
    # A skipped job counts as passed for the required check.
    if: ${{ needs.changes.outputs.hacs == 'true' }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
