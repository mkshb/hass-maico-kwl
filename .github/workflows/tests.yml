name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"

      - name: "Install test requirements"
        run: pip install -r requirements_test.txt

      - name: "Run tests"
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

      - name: "Type check"
        run: mypy

  card:
    name: "Card"
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: "frontend-src"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Set up Node"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend-src/package-lock.json"

      - name: "Install dependencies"
        run: npm ci

      - name: "Type check"
        run: npm run typecheck

      - name: "Build"
        run: npm run build

      - name: "Committed build matches the sources"
        run: |
          git add --intent-to-add ../custom_components/maico_kwl/frontend
          git diff --exit-code -- ../custom_components/maico_kwl/frontend
